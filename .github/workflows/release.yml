name: Gybe Release

# v* tag push'unda üç platform paketi üretir ve TEK GitHub Release'e yükler:
# Linux (AppImage + .deb), macOS (universal .dmg), Windows (NSIS .exe).
# Paketlerin tamamı İMZASIZDIR — kapsam, gerekçe ve Uyarı ekranı aşma notları:
# docs/adr/0005 (2026-11-09 tadilatı dâhil) + docs/release-footer.md
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage + .deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf
          # AppImage paketlemesi (linuxdeploy) FUSE ister; ubuntu-24.04
          # runner'larında paket adı t64 takısıyla geldiği için ikisini de dene.
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build bundles
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-macos:
    name: Build macOS (universal .dmg, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Universal binary: Apple Silicon + Intel tek .dmg'de. lipo Xcode CLT
      # ile runner'da zaten mevcut; imzâ adımı bilinçli olarak YOK (ADR-0005).
      - name: Setup Rust toolchain (apple silicon + intel targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build universal .dmg
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (NSIS .exe, unsigned)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true

      - name: Compose release body
        run: |
          # Release gövdesi = CHANGELOG'daki bu sürümün bölümü (## [x.y.z] ile
          # bir sonraki ## arasına kadar) + kurulum/imzasızlık dip notu.
          # v0.2.1'de tauri-action'a bırakılınca gövde commit mesajı olarak
          # kalmıştı; artık release'i bu job gh CLI ile kendisi oluşturuyor.
          VER="${GITHUB_REF_NAME#v}"
          {
            awk -v head="## [$VER]" '
              index($0, head) == 1 { grab=1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md
            cat docs/release-footer.md
          } > RELEASE_BODY.md
          test -s RELEASE_BODY.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t files < <(find dist -type f | sort)
          echo "Assets: ${files[*]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --verify-tag \
            --title "Gybe $GITHUB_REF_NAME" \
            --notes-file RELEASE_BODY.md
